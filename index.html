<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusAI - Unified Model Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'slide-up': 'slideUp 0.3s ease-out',
                        'pulse-slow': 'pulse 3s infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(10px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Scrollbar */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(156, 163, 175, 0.3);
            border-radius: 20px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: rgba(156, 163, 175, 0.5);
        }
        
        /* Typing Indicator Animation */
        .typing-dot {
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 font-sans overflow-hidden h-screen flex selection:bg-indigo-500/30">

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-gray-900 text-gray-100 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out border-r border-white/10 flex flex-col">
        <!-- Logo -->
        <div class="p-4 flex items-center justify-between">
            <div class="flex items-center space-x-2 cursor-pointer hover:bg-white/5 p-2 rounded-lg transition-colors w-full">
                <div class="w-8 h-8 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-lg flex items-center justify-center shadow-lg shadow-indigo-500/20">
                    <i data-lucide="cpu" class="text-white w-4 h-4"></i>
                </div>
                <span class="font-bold text-lg tracking-tight">NexusAI</span>
            </div>
            <button id="closeSidebar" class="md:hidden p-2 hover:bg-white/10 rounded-lg">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- New Chat Button -->
        <div class="px-3 py-2">
            <button onclick="resetChat()" class="w-full flex items-center justify-between px-4 py-3 bg-white/5 hover:bg-white/10 border border-white/5 hover:border-white/10 rounded-xl transition-all group">
                <div class="flex items-center space-x-3">
                    <div class="p-1.5 bg-white/10 rounded-full group-hover:bg-white/20 transition-colors">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                    </div>
                    <span class="font-medium text-sm">New Chat</span>
                </div>
                <i data-lucide="sparkles" class="w-4 h-4 text-indigo-400 opacity-0 group-hover:opacity-100 transition-opacity"></i>
            </button>
        </div>

        <!-- History -->
        <div class="flex-1 overflow-y-auto px-3 py-2 scrollbar-hide">
            <div class="text-xs font-semibold text-gray-500 mb-3 px-2 uppercase tracking-wider">Recent</div>
            <div class="space-y-1" id="historyList">
                <!-- History items injected by JS -->
            </div>
        </div>

        <!-- User Profile -->
        <div class="p-4 border-t border-white/10">
            <button class="flex items-center space-x-3 w-full p-2 hover:bg-white/5 rounded-lg text-sm text-gray-300 transition-colors">
                <div class="w-8 h-8 rounded-full bg-gradient-to-r from-pink-500 to-rose-500 flex items-center justify-center text-white font-bold shadow-lg shadow-pink-500/20">
                    JD
                </div>
                <div class="flex-1 text-left">
                    <div class="font-medium text-white">John Doe</div>
                    <div class="text-xs text-gray-500">Pro Plan</div>
                </div>
                <i data-lucide="settings" class="w-4 h-4"></i>
            </button>
        </div>
    </aside>

    <!-- Overlay for Mobile -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-30 hidden backdrop-blur-sm md:hidden"></div>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-w-0 relative md:ml-64 transition-all duration-300">
        
        <!-- Header -->
        <header class="h-16 flex items-center justify-between px-4 border-b border-gray-200 dark:border-white/5 bg-white/80 dark:bg-gray-950/80 backdrop-blur-md z-20 sticky top-0">
            <div class="flex items-center">
                <button id="openSidebar" class="md:hidden p-2 -ml-2 mr-2 text-gray-500 hover:text-gray-700 dark:hover:text-gray-200 rounded-lg hover:bg-gray-100 dark:hover:bg-white/10 transition-colors">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>
                
                <!-- Model Selector -->
                <div class="relative">
                    <button id="modelBtn" class="flex items-center space-x-2 px-3 py-2 rounded-xl hover:bg-gray-100 dark:hover:bg-white/10 transition-colors text-gray-700 dark:text-gray-200 font-medium text-lg group">
                        <span class="flex items-center">
                            <span id="currentModelName">GPT-4o</span>
                            <span id="currentModelProvider" class="ml-2 text-xs bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-400 px-1.5 py-0.5 rounded border border-indigo-200 dark:border-indigo-800">OpenAI</span>
                        </span>
                        <i data-lucide="chevron-down" class="w-4 h-4 text-gray-400 group-hover:text-gray-600 transition-transform duration-200" id="modelChevron"></i>
                    </button>

                    <!-- Dropdown -->
                    <div id="modelDropdown" class="absolute top-full left-0 mt-2 w-80 md:w-96 bg-white dark:bg-gray-800 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-700 z-50 overflow-hidden hidden origin-top-left transform transition-all duration-200 scale-95 opacity-0">
                        <div class="p-3 bg-gray-50 dark:bg-gray-900/50 border-b border-gray-200 dark:border-gray-700">
                            <div class="relative">
                                <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-3.5 h-3.5 text-gray-400"></i>
                                <input type="text" placeholder="Search models..." class="w-full pl-9 pr-3 py-1.5 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg text-sm text-gray-700 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            </div>
                        </div>
                        <div class="max-h-[400px] overflow-y-auto p-2 space-y-1" id="modelList">
                            <!-- Models injected via JS -->
                        </div>
                        <div class="p-3 border-t border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/30">
                            <button class="w-full text-center text-xs font-medium text-indigo-600 dark:text-indigo-400 hover:underline">
                                View all 24 available models
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Header Actions -->
            <div class="flex items-center space-x-2">
                <button class="p-2 text-gray-400 hover:text-indigo-500 transition-colors rounded-full hover:bg-gray-100 dark:hover:bg-white/5" title="Saved Prompts">
                    <i data-lucide="zap" class="w-4.5 h-4.5"></i>
                </button>
                <div class="w-8 h-8 bg-indigo-500/10 rounded-full flex items-center justify-center text-indigo-500 font-bold text-xs border border-indigo-500/20">
                    XP
                </div>
            </div>
        </header>

        <!-- Chat Area -->
        <div id="chatContainer" class="flex-1 overflow-y-auto custom-scrollbar p-4 pb-32">
            <!-- Empty State -->
            <div id="emptyState" class="h-full flex flex-col items-center justify-center text-center animate-fade-in">
                <div class="w-16 h-16 bg-white/5 rounded-2xl flex items-center justify-center mb-6 ring-1 ring-white/10 shadow-2xl">
                    <i data-lucide="sparkles" class="w-8 h-8 text-indigo-500"></i>
                </div>
                <h2 class="text-2xl font-semibold text-gray-900 dark:text-white mb-2">
                    How can I help you today?
                </h2>
                <p class="text-gray-500 dark:text-gray-400 max-w-md mb-10 text-sm">
                    Access the world's most powerful AI models from a single unified interface. Select a model above to get started.
                </p>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-2xl w-full">
                    <button onclick="sendPrompt('Compare Frameworks React vs Vue vs Angular performance')" class="p-4 rounded-xl border border-gray-200 dark:border-white/10 bg-white dark:bg-white/5 hover:bg-gray-50 dark:hover:bg-white/10 transition-all text-left group">
                        <div class="font-medium text-gray-800 dark:text-gray-200 mb-1 group-hover:text-indigo-500 dark:group-hover:text-indigo-400 transition-colors">Compare Frameworks</div>
                        <div class="text-xs text-gray-500 dark:text-gray-400">React vs Vue vs Angular performance</div>
                    </button>
                    <button onclick="sendPrompt('Debug Python Find memory leaks in my script')" class="p-4 rounded-xl border border-gray-200 dark:border-white/10 bg-white dark:bg-white/5 hover:bg-gray-50 dark:hover:bg-white/10 transition-all text-left group">
                        <div class="font-medium text-gray-800 dark:text-gray-200 mb-1 group-hover:text-indigo-500 dark:group-hover:text-indigo-400 transition-colors">Debug Python</div>
                        <div class="text-xs text-gray-500 dark:text-gray-400">Find memory leaks in my script</div>
                    </button>
                    <button onclick="sendPrompt('Write an Essay The impact of AI on creative industries')" class="p-4 rounded-xl border border-gray-200 dark:border-white/10 bg-white dark:bg-white/5 hover:bg-gray-50 dark:hover:bg-white/10 transition-all text-left group">
                        <div class="font-medium text-gray-800 dark:text-gray-200 mb-1 group-hover:text-indigo-500 dark:group-hover:text-indigo-400 transition-colors">Write an Essay</div>
                        <div class="text-xs text-gray-500 dark:text-gray-400">The impact of AI on creative industries</div>
                    </button>
                    <button onclick="sendPrompt('Generate Image A cyberpunk city in watercolor style')" class="p-4 rounded-xl border border-gray-200 dark:border-white/10 bg-white dark:bg-white/5 hover:bg-gray-50 dark:hover:bg-white/10 transition-all text-left group">
                        <div class="font-medium text-gray-800 dark:text-gray-200 mb-1 group-hover:text-indigo-500 dark:group-hover:text-indigo-400 transition-colors">Generate Image</div>
                        <div class="text-xs text-gray-500 dark:text-gray-400">A cyberpunk city in watercolor style</div>
                    </button>
                </div>
            </div>

            <!-- Messages List -->
            <div id="messagesList" class="max-w-3xl mx-auto pt-4 hidden space-y-6">
                <!-- Messages injected via JS -->
            </div>

            <!-- Typing Indicator -->
            <div id="typingIndicator" class="max-w-3xl mx-auto pt-4 hidden px-4">
                 <div class="flex gap-4">
                    <div id="typingAvatar" class="flex-shrink-0 w-8 h-8 rounded-full bg-green-500 flex items-center justify-center text-white shadow-lg">
                        <i data-lucide="bot" class="w-4 h-4"></i>
                    </div>
                    <div class="flex items-center space-x-1 h-8">
                        <div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div>
                        <div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div>
                        <div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div>
                    </div>
                 </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-gray-50 via-gray-50 to-transparent dark:from-gray-950 dark:via-gray-950 pt-10 pb-6">
            <div class="max-w-3xl mx-auto relative">
                <div class="relative flex items-end gap-2 bg-white dark:bg-gray-800/80 backdrop-blur-xl border border-gray-200 dark:border-white/10 rounded-2xl shadow-lg shadow-gray-200/50 dark:shadow-black/20 overflow-hidden ring-1 ring-transparent focus-within:ring-indigo-500/50 transition-all">
                    
                    <button class="p-3 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition-colors self-end mb-0.5">
                        <i data-lucide="plus" class="w-5 h-5"></i>
                    </button>

                    <textarea id="chatInput"
                        placeholder="Message GPT-4o..."
                        class="w-full max-h-32 py-3.5 bg-transparent border-none focus:ring-0 resize-none text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 leading-relaxed scrollbar-hide outline-none"
                        rows="1"
                        style="min-height: 52px;"
                    ></textarea>

                    <button id="sendBtn" disabled
                        class="p-2 mr-2 mb-2 rounded-xl transition-all duration-200 bg-gray-200 dark:bg-white/5 text-gray-400 cursor-not-allowed disabled:opacity-50">
                        <i data-lucide="send" class="w-4.5 h-4.5"></i>
                    </button>
                </div>
                <div class="text-center mt-2">
                    <p class="text-[10px] text-gray-400 dark:text-gray-500">
                        NexusAI allows access to 3rd party models. AI can make mistakes.
                    </p>
                </div>
            </div>
        </div>

    </main>

    <script>
        // --- Data ---
        const AVAILABLE_MODELS = [
            {
                id: 'gpt-4o',
                name: 'GPT-4o',
                provider: 'OpenAI',
                iconColor: 'bg-green-500',
                description: 'Best for complex reasoning & speed',
                tags: ['Reasoning', 'Multimodal']
            },
            {
                id: 'claude-3-5-sonnet',
                name: 'Claude 3.5 Sonnet',
                provider: 'Anthropic',
                iconColor: 'bg-orange-500',
                description: 'Exceptional at coding & nuance',
                tags: ['Coding', 'Writing']
            },
            {
                id: 'gemini-1-5-pro',
                name: 'Gemini 1.5 Pro',
                provider: 'Google',
                iconColor: 'bg-blue-500',
                description: 'Massive context window & analysis',
                tags: ['Analysis', 'Creative']
            },
            {
                id: 'llama-3-70b',
                name: 'Llama 3 70B',
                provider: 'Meta',
                iconColor: 'bg-purple-500',
                description: 'Open source powerhouse',
                tags: ['Fast', 'Open Source']
            }
        ];

        const MOCK_HISTORY = [
            'React Component Structure',
            'Explain Quantum Computing',
            'Python Script Optimization',
            'Recipe for Sourdough'
        ];

        // --- State ---
        let currentModel = AVAILABLE_MODELS[0];
        let isSidebarOpen = false;
        let isDropdownOpen = false;

        // --- Elements ---
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const modelDropdown = document.getElementById('modelDropdown');
        const modelBtn = document.getElementById('modelBtn');
        const modelList = document.getElementById('modelList');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const messagesList = document.getElementById('messagesList');
        const emptyState = document.getElementById('emptyState');
        const typingIndicator = document.getElementById('typingIndicator');
        const chatContainer = document.getElementById('chatContainer');

        // --- Initialization ---
        function init() {
            renderHistory();
            renderModelList();
            lucide.createIcons();
            
            // Input Auto-resize
            chatInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
                
                if(this.value.trim()) {
                    sendBtn.disabled = false;
                    sendBtn.classList.remove('bg-gray-200', 'dark:bg-white/5', 'text-gray-400', 'cursor-not-allowed');
                    sendBtn.classList.add('bg-indigo-600', 'text-white', 'hover:bg-indigo-700', 'shadow-lg');
                } else {
                    sendBtn.disabled = true;
                    sendBtn.classList.add('bg-gray-200', 'dark:bg-white/5', 'text-gray-400', 'cursor-not-allowed');
                    sendBtn.classList.remove('bg-indigo-600', 'text-white', 'hover:bg-indigo-700', 'shadow-lg');
                }
            });

            chatInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSend();
                }
            });

            sendBtn.addEventListener('click', () => handleSend());
            
            // Sidebar Toggles
            document.getElementById('openSidebar').addEventListener('click', toggleSidebar);
            document.getElementById('closeSidebar').addEventListener('click', toggleSidebar);
            sidebarOverlay.addEventListener('click', toggleSidebar);

            // Model Dropdown Toggles
            modelBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleDropdown();
            });

            document.addEventListener('click', (e) => {
                if (!modelDropdown.contains(e.target) && !modelBtn.contains(e.target)) {
                    closeDropdown();
                }
            });
        }

        // --- Functions ---

        function toggleSidebar() {
            isSidebarOpen = !isSidebarOpen;
            if (isSidebarOpen) {
                sidebar.classList.remove('-translate-x-full');
                sidebarOverlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                sidebarOverlay.classList.add('hidden');
            }
        }

        function toggleDropdown() {
            isDropdownOpen = !isDropdownOpen;
            const chevron = document.getElementById('modelChevron');
            
            if (isDropdownOpen) {
                modelDropdown.classList.remove('hidden');
                setTimeout(() => {
                    modelDropdown.classList.remove('scale-95', 'opacity-0');
                    modelDropdown.classList.add('scale-100', 'opacity-100');
                }, 10);
                chevron.classList.add('rotate-180');
            } else {
                closeDropdown();
            }
        }

        function closeDropdown() {
            isDropdownOpen = false;
            const chevron = document.getElementById('modelChevron');
            modelDropdown.classList.remove('scale-100', 'opacity-100');
            modelDropdown.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modelDropdown.classList.add('hidden');
            }, 200);
            chevron.classList.remove('rotate-180');
        }

        function renderHistory() {
            const container = document.getElementById('historyList');
            container.innerHTML = MOCK_HISTORY.map(title => `
                <button class="w-full text-left px-3 py-2.5 rounded-lg text-sm text-gray-300 hover:bg-white/5 hover:text-white transition-colors flex items-center group truncate">
                    <i data-lucide="message-square" class="mr-3 w-4 h-4 text-gray-500 group-hover:text-gray-300 flex-shrink-0"></i>
                    <span class="truncate">${title}</span>
                </button>
            `).join('');
        }

        function renderModelList() {
            modelList.innerHTML = AVAILABLE_MODELS.map(model => `
                <button onclick="selectModel('${model.id}')" class="w-full flex items-start space-x-3 p-3 rounded-xl transition-all ${currentModel.id === model.id ? 'bg-indigo-50 dark:bg-indigo-900/20 border border-indigo-200 dark:border-indigo-800/50' : 'hover:bg-gray-100 dark:hover:bg-white/5 border border-transparent'}">
                    <div class="w-10 h-10 rounded-lg ${model.iconColor} flex items-center justify-center flex-shrink-0 text-white shadow-sm">
                        <i data-lucide="cpu" class="w-5 h-5"></i>
                    </div>
                    <div class="flex-1 text-left">
                        <div class="flex items-center justify-between">
                            <span class="font-semibold text-sm ${currentModel.id === model.id ? 'text-indigo-700 dark:text-indigo-300' : 'text-gray-900 dark:text-gray-100'}">${model.name}</span>
                            ${currentModel.id === model.id ? '<i data-lucide="check" class="w-3.5 h-3.5 text-indigo-600 dark:text-indigo-400"></i>' : ''}
                        </div>
                        <div class="text-xs text-gray-500 mt-0.5">${model.description}</div>
                        <div class="flex gap-1.5 mt-2">
                            ${model.tags.map(tag => `<span class="text-[10px] font-medium px-1.5 py-0.5 rounded bg-gray-100 dark:bg-white/10 text-gray-600 dark:text-gray-400">${tag}</span>`).join('')}
                        </div>
                    </div>
                </button>
            `).join('');
            lucide.createIcons();
        }

        function selectModel(id) {
            currentModel = AVAILABLE_MODELS.find(m => m.id === id);
            
            // Update Header UI
            document.getElementById('currentModelName').textContent = currentModel.name;
            document.getElementById('currentModelProvider').textContent = currentModel.provider;
            chatInput.placeholder = `Message ${currentModel.name}...`;
            
            // Update Typing Avatar Color
            const avatar = document.getElementById('typingAvatar');
            avatar.className = `flex-shrink-0 w-8 h-8 rounded-full ${currentModel.iconColor} flex items-center justify-center text-white shadow-lg`;
            
            renderModelList(); // Re-render list to show checkmark
            closeDropdown();
        }

        function sendPrompt(text) {
            chatInput.value = text;
            handleSend();
        }

        function resetChat() {
            messagesList.innerHTML = '';
            messagesList.classList.add('hidden');
            emptyState.classList.remove('hidden');
        }

        function handleSend() {
            const text = chatInput.value.trim();
            if (!text) return;

            // Switch view from empty state to chat list
            emptyState.classList.add('hidden');
            messagesList.classList.remove('hidden');

            // Add User Message
            appendMessage('user', text);
            
            // Reset Input
            chatInput.value = '';
            chatInput.style.height = '52px';
            sendBtn.disabled = true;
            sendBtn.classList.add('bg-gray-200', 'dark:bg-white/5', 'text-gray-400', 'cursor-not-allowed');
            sendBtn.classList.remove('bg-indigo-600', 'text-white');

            // Show Typing Indicator
            typingIndicator.classList.remove('hidden');
            scrollToBottom();

            // Simulate API Response
            setTimeout(() => {
                typingIndicator.classList.add('hidden');
                const response = `This is a simulated response from ${currentModel.name}. \n\nI am running on the ${currentModel.provider} infrastructure. My strengths include ${currentModel.tags.join(' and ')}.`;
                appendMessage('ai', response);
            }, 1500);
        }

        function appendMessage(role, content) {
            const div = document.createElement('div');
            div.className = `flex w-full ${role === 'user' ? 'justify-end' : 'justify-start'} mb-6 animate-slide-up`;
            
            const isUser = role === 'user';
            const avatarHtml = isUser 
                ? `<div class="flex-shrink-0 w-8 h-8 rounded-full bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-300 flex items-center justify-center"><i data-lucide="user" class="w-4 h-4"></i></div>`
                : `<div class="flex-shrink-0 w-8 h-8 rounded-full ${currentModel.iconColor} flex items-center justify-center text-white shadow-lg shadow-${currentModel.iconColor}/20"><i data-lucide="bot" class="w-4 h-4"></i></div>`;

            div.innerHTML = `
                <div class="flex max-w-3xl w-full ${isUser ? 'flex-row-reverse' : 'flex-row'} gap-4 px-4">
                    ${avatarHtml}
                    <div class="flex flex-col ${isUser ? 'items-end' : 'items-start'} min-w-0">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-xs font-medium text-gray-500 dark:text-gray-400">${isUser ? 'You' : currentModel.name}</span>
                        </div>
                        <div class="prose dark:prose-invert max-w-none text-sm md:text-base leading-relaxed ${isUser ? 'bg-gray-100 dark:bg-white/10 text-gray-900 dark:text-gray-100 rounded-2xl rounded-tr-sm px-5 py-3' : 'text-gray-800 dark:text-gray-200 pl-0 py-1'}">
                            ${content.replace(/\n/g, '<br>')}
                        </div>
                         ${!isUser ? `
                        <div class="flex items-center gap-3 mt-2 ml-1">
                            <button class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition-colors"><i data-lucide="sparkles" class="w-3.5 h-3.5"></i></button>
                            <button class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition-colors"><i data-lucide="more-horizontal" class="w-3.5 h-3.5"></i></button>
                        </div>` : ''}
                    </div>
                </div>
            `;

            messagesList.appendChild(div);
            lucide.createIcons();
            scrollToBottom();
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Start
        init();
    </script>
